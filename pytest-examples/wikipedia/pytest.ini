[pytest]
testpaths = tests
addopts = -ra --strict-markers --junitxml=test-results/junit.xml --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output=test-results/browser
junit_suite_name = wikipedia-search
markers =
    api: Wikipedia MediaWiki API tests (no browser required)
    ui: Wikipedia browser tests (Chromium required)
